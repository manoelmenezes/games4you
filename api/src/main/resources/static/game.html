<!DOCTYPE html>
<html>
<head>
    <title>Hello WebSocket</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link href="/main.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="/game.js"></script>
</head>
<body>
<noscript><h2 style="color: #ff0000">Seems your browser doesn't support Javascript! Websocket relies on Javascript being
    enabled. Please enable
    Javascript and reload this page!</h2></noscript>
<div id="main-content" class="container">
    <div class="row">        
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="playerId">What is your player Id?</label>
                    <input type="text" id="playerId" class="form-control" placeholder="Your player id here...">
                </div>
                <button id="createGame" class="btn btn-default" type="submit">Create Game</button>
            
                <div class="form-group">
                    <label for="gameId">This is the game id</label>
                    <input type="text" id="gameId" class="form-control" placeholder="This is game id">
                </div>
                <button id="send" class="btn btn-default" type="submit">Move</button>
            </form>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <table id="conversation" class="table table-striped">
                <thead>
                <tr>
                    <th>Game</th>
                </tr>
                </thead>
                <tbody id="game">
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
